services:
  # --- DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: transport_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_DATABASE:-transport_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transport_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: transport_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - transport_network

  # --- BACKEND (Laravel) ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: transport_backend
    restart: always
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-transport_db}
      DB_USERNAME: ${DB_USERNAME:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
    depends_on:
      - postgres
    networks:
      - transport_network

  nginx:
    image: nginx:alpine
    container_name: transport_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./Backend:/var/www
      - ./Backend/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - transport_network

  # --- FRONTEND (React) ---
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: transport_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - transport_network

networks:
  transport_network:
    driver: bridge

volumes:
  postgres_data:
